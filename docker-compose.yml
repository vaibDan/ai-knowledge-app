services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-knowledge-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai-knowledge-app
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: